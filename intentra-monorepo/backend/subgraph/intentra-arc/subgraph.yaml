specVersion: 1.0.0
description: Intentra escrow on Arc — trust scores built from what actually happened on-chain.
repository: https://github.com/Soar-On-Technologies-Global-Concept-Ltd/ETHOnline-Startup
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: IntentraEscrow
    network: arc
    source:
      address: "0xeF3a099CC877F6e274b037847A6ee44C4d62648D"   # live on Arc testnet
      abi: IntentraEscrow
      startBlock: 61719028
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Provider
        - Intent
      abis:
        - name: IntentraEscrow
          file: ./abis/IntentraEscrow.json
      eventHandlers:
        - event: IntentCreated(indexed uint256,indexed address,indexed address,address,uint256)
          handler: handleIntentCreated
        - event: IntentFunded(indexed uint256,uint256)
          handler: handleIntentFunded
        - event: DisputeRaised(indexed uint256,indexed address)
          handler: handleDisputeRaised
        - event: AIProposalSubmitted(indexed uint256,uint256,uint256)
          handler: handleAIProposalSubmitted
        - event: AppealEscalated(indexed uint256,indexed address,uint256)
          handler: handleAppealEscalated
        - event: IntentResolved(indexed uint256,uint256,uint256)
          handler: handleIntentResolved
        - event: AbandonmentExecuted(indexed uint256,indexed address)
          handler: handleAbandonmentExecuted
      file: ./src/mapping.ts
