services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intentra
      POSTGRES_PASSWORD: intentra
      POSTGRES_DB: intentra
    ports: ["5432:5432"]
    volumes: ["intentra-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentra"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://intentra:intentra@postgres:5432/intentra
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["intentra-evidence:/srv/.data"]

volumes:
  intentra-pg:
  intentra-evidence:
