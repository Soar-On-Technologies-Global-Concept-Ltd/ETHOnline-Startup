version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: intentra_db
    restart: always
    environment:
      POSTGRES_USER: intentra
      POSTGRES_PASSWORD: intentra_password
      POSTGRES_DB: intentradb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentra -d intentradb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intentra_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  pgdata:
  redisdata:
